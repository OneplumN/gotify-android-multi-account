name: Development APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-multi-account
    tags:
      - dev-*

jobs:
  build:
    name: Build development APK
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build development APK
        run: ./gradlew :app:assembleDevelopment --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/development/app-development.apk dist/zgotify.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zgotify
          path: dist/zgotify.apk
          retention-days: 1

      - name: Remove previous development releases
        if: startsWith(github.ref, 'refs/tags/dev-')
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              if [[ "$tag" == dev-* && "$tag" != "$CURRENT_TAG" ]]; then
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
              fi
            done

      - name: Remove previous development artifacts
        if: startsWith(github.ref, 'refs/tags/dev-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq '.artifacts[] | select(.name == "zgotify" or .name == "Gotify-zxqh" or .name == "Gotify-DEV-multi-account") | .id' |
            while read -r artifact_id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" || true
            done

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/dev-')
        uses: softprops/action-gh-release@v2
        with:
          name: zgotify
          prerelease: true
          files: dist/zgotify.apk
